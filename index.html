header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;background:rgba(247,248,251,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(229,231,235,.8);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:white;font-size:20px}.pill{font-size:12px;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3447b8;font-weight:700}.container{max-width:720px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}h1,h2,h3,p{margin-top:0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.hero h1{font-size:28px;line-height:1.1;margin-bottom:8px}.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.seg button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:12px;color:var(--ink)}.seg button.active{background:#eef2ff;border-color:#c7d2fe;color:#3346b3;font-weight:800}.primary{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px 16px;border-radius:14px;font-weight:800;width:100%}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 14px;border-radius:13px;font-weight:700}.ghost{border:0;background:#f2f4f7;color:#344054;padding:10px 12px;border-radius:12px;font-weight:700}.danger{color:var(--danger)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stat{padding:12px;background:#f9fafb;border-radius:14px}.stat strong{display:block;font-size:20px}.bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}.hidden{display:none!important}.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:#475467;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}.check{display:flex;align-items:center;gap:10px;padding:10px 0}.check input{width:20px;height:20px}.workout-card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:#fff}.exercise-title{font-size:18px;font-weight:800}.badge{font-size:11px;border-radius:999px;padding:4px 8px;background:#f2f4f7;color:#475467}.sets{margin-top:10px}.setrow{display:grid;grid-template-columns:32px 1fr 1fr 44px;gap:7px;align-items:center;margin:7px 0}.setrow input{width:100%;min-width:0;padding:9px;border:1px solid var(--line);border-radius:10px}.setrow input[type=checkbox]{width:24px;height:24px}.coach{min-height:380px}.big-num{font-size:42px;font-weight:900;line-height:1}.feedback{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.feedback button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px}.feedback button.selected{border-color:#7c8cff;background:#eef2ff;color:#3447b8;font-weight:800}.details{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.details summary{font-weight:800;color:#344054}.list{padding-left:20px;margin-bottom:0}.list li{margin:7px 0}.nav{position:fixed;left:0;right:0;bottom:0;padding:7px 8px calc(env(safe-area-inset-bottom) + 7px);background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:30}.nav button{border:0;background:transparent;padding:7px 2px;color:#667085;font-size:12px}.nav button b{display:block;font-size:20px;margin-bottom:2px}.nav button.active{color:var(--brand);font-weight:800}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 14px;border-radius:999px;z-index:50;max-width:88%;text-align:center;box-shadow:var(--shadow)}.empty{padding:28px;text-align:center;color:var(--muted)}.tag{display:inline-block;margin:3px 4px 3px 0;padding:5px 8px;border-radius:999px;background:#f2f4f7;font-size:12px}.progress-row{margin:10px 0}.small{font-size:13px}.hr{height:1px;background:var(--line);margin:14px 0}.notice{padding:10px 12px;background:#fff8eb;border:1px solid #fedf89;border-radius:12px;color:#7a4b00;font-size:13px}.success{background:#ecfdf3;border-color:#abefc6;color:#067647}.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:60;display:flex;align-items:flex-end}.sheet{width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));}.sheet h2{margin-bottom:6px}.option{padding:13px;border:1px solid var(--line);border-radius:14px;margin:8px 0}.option:active{background:#f9fafb}.install{font-size:13px}.chipline{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:999px;background:#f2f4f7;font-size:13px;font-weight:700}.coach-nav{display:flex;gap:8px;margin-top:14px}.coach-nav button{flex:1}.green{color:var(--good)}
@media(max-width:390px){.container{padding:12px}.card{border-radius:17px;padding:14px}.hero h1{font-size:25px}.grid3{grid-template-columns:1fr 1fr}.setrow{grid-template-columns:26px 1fr 1fr 38px}}

<body>
<header><div class="brand"><div class="logo">F</div>ForgeFit</div><span class="pill" id="headerMode">Adaptive</span></header>
<main id="app"></main>

<script>
function newID(){return (globalThis.crypto&&typeof crypto.randomUUID==='function')?crypto.randomUUID():'ff-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
const MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Quadriceps','Hamstrings','Glutes','Calves','Core'];
const EX=[
{id:'incline_pushup',name:'Incline Push-Up',p:'Chest',s:['Triceps','Shoulders'],eq:['bodyweight','counter','bench'],type:'strength',compound:1,steps:['Place hands on a stable counter or inclined bench.','Keep ribs stacked and body long.','Lower chest toward the surface, then press away.'],tips:['Higher surface = easier.','Keep your head above your heart.']},
{id:'incline_db_press',name:'Incline Dumbbell Press',p:'Chest',s:['Shoulders','Triceps'],eq:['dumbbells','bench'],type:'strength',compound:1,steps:['Set the bench to a comfortable incline.','Lower dumbbells beside your chest under control.','Press up while keeping your head and upper body elevated.'],tips:['Do not set the bench flat.']},
{id:'band_press',name:'Standing Band Chest Press',p:'Chest',s:['Triceps','Shoulders'],eq:['bands','anchor'],type:'strength',compound:1,steps:['Anchor the band securely behind you.','Stand tall with staggered feet.','Press forward and return slowly.'],tips:['Use a lighter band if shoulders take over.']},
{id:'db_row',name:'Supported One-Arm Dumbbell Row',p:'Back',s:['Biceps'],eq:['dumbbells','bench'],type:'strength',compound:1,steps:['Brace one hand on the bench while staying comfortably upright.','Pull elbow toward hip.','Lower under control.'],tips:['Keep your head comfortably above your heart.']},
{id:'band_row',name:'Standing Resistance Band Row',p:'Back',s:['Biceps'],eq:['bands','anchor'],type:'strength',compound:1,steps:['Anchor band at chest height.','Pull elbows toward ribs.','Return slowly without shrugging.'],tips:['Pause briefly at the back.']},
{id:'band_pull_apart',name:'Band Pull-Apart',p:'Back',s:['Shoulders'],eq:['bands'],type:'strength',compound:0,steps:['Hold band at chest height.','Pull hands apart with soft elbows.','Return slowly.'],tips:['Keep shoulders down.']},
{id:'seated_db_press',name:'Seated Dumbbell Shoulder Press',p:'Shoulders',s:['Triceps'],eq:['dumbbells','bench'],type:'strength',compound:1,steps:['Set bench upright or high incline.','Start dumbbells near shoulder level.','Press overhead and lower with control.'],tips:['Stay upright with head supported if comfortable.']},
{id:'standing_db_press',name:'Standing Dumbbell Shoulder Press',p:'Shoulders',s:['Triceps','Core'],eq:['dumbbells'],type:'strength',compound:1,steps:['Stand tall and brace.','Press dumbbells overhead.','Lower slowly to shoulder level.'],tips:['Use light weights until balance feels automatic.']},
{id:'band_lateral_raise',name:'Standing Band Lateral Raise',p:'Shoulders',s:[],eq:['bands'],type:'strength',compound:0,steps:['Stand on the band.','Raise arms to a comfortable level.','Lower slowly.'],tips:['Keep the movement smooth, not jerky.']},
{id:'db_curl',name:'Dumbbell Curl',p:'Biceps',s:[],eq:['dumbbells'],type:'strength',compound:0,steps:['Stand tall with weights at sides.','Curl without swinging.','Lower fully under control.'],tips:['Keep elbows near your ribs.']},
{id:'band_curl',name:'Standing Band Curl',p:'Biceps',s:[],eq:['bands'],type:'strength',compound:0,steps:['Stand on the middle of the band.','Curl while keeping elbows near sides.','Lower slowly.'],tips:['Adjust band length to change resistance.']},
{id:'band_pressdown',name:'Band Triceps Pressdown',p:'Triceps',s:[],eq:['bands','anchor'],type:'strength',compound:0,steps:['Anchor the band securely above head height.','Keep elbows near ribs.','Press down and return slowly.'],tips:['Use a lighter band if shoulders begin helping.']},
{id:'db_triceps_kickback',name:'Supported Dumbbell Triceps Kickback',p:'Triceps',s:[],eq:['dumbbells','bench'],type:'strength',compound:0,steps:['Support one hand on bench and keep torso at a comfortable upright angle.','Keep upper arm still.','Straighten elbow and return slowly.'],tips:['Choose a torso angle that keeps your head above your heart.']},
{id:'goblet_squat',name:'Goblet Squat',p:'Quadriceps',s:['Glutes','Core'],eq:['dumbbells'],type:'strength',compound:1,steps:['Hold one dumbbell at chest height.','Sit down between your hips with full-foot pressure.','Stand smoothly.'],tips:['Use a chair target if helpful.']},
{id:'air_squat',name:'Bodyweight Squat',p:'Quadriceps',s:['Glutes','Core'],eq:['bodyweight'],type:'strength',compound:1,steps:['Stand at a comfortable width.','Sit down and back between hips.','Stand with knees tracking over toes.'],tips:['Use a chair behind you for confidence or depth control.']},
{id:'reverse_lunge',name:'Reverse Lunge',p:'Quadriceps',s:['Glutes','Hamstrings'],eq:['bodyweight'],type:'strength',compound:1,steps:['Step one foot backward.','Lower under control.','Drive through the front foot to return.'],tips:['Hold a counter or wall for balance if wanted.']},
{id:'stepup',name:'Step-Up',p:'Glutes',s:['Quadriceps','Hamstrings'],eq:['stairs','dumbbells'],type:'strength',compound:1,steps:['Place full foot on a stable step.','Drive through the working leg.','Lower with control.'],tips:['Use railing/support whenever helpful.']},
{id:'db_rdl',name:'Dumbbell Romanian Deadlift',p:'Hamstrings',s:['Glutes','Back'],eq:['dumbbells'],type:'strength',compound:1,steps:['Keep dumbbells close to legs.','Push hips back with soft knees while keeping your head above heart level.','Stand tall by squeezing glutes.'],tips:['Use a shallow range if needed to respect your position rule.']},
{id:'standing_leg_curl',name:'Standing Band Leg Curl',p:'Hamstrings',s:['Glutes'],eq:['bands','anchor'],type:'strength',compound:0,steps:['Anchor band low around one ankle.','Hold a stable support if helpful.','Bring heel toward glute and return slowly.'],tips:['Keep thighs mostly aligned.']},
{id:'band_kickback',name:'Standing Band Glute Kickback',p:'Glutes',s:['Hamstrings'],eq:['bands','anchor'],type:'strength',compound:0,steps:['Anchor band low around one ankle.','Stand tall holding support if helpful.','Drive leg backward without arching your back.'],tips:['Use a smaller range if balance becomes limiting.']},
{id:'band_lateral',name:'Tied-Band Lateral Walk',p:'Glutes',s:['Quadriceps'],eq:['bands'],type:'strength',compound:1,steps:['Tie the therapy band securely into a loop.','Keep a small bend in your knees.','Take controlled side steps with steady band tension.'],tips:['Use a wall or counter for light support.']},
{id:'calf_raise',name:'Standing Calf Raise',p:'Calves',s:[],eq:['bodyweight'],type:'strength',compound:0,steps:['Rise onto the balls of your feet.','Pause at the top.','Lower slowly.'],tips:['Hold a wall or counter as needed.']},
{id:'farmer_carry',name:'Farmer Carry',p:'Core',s:['Shoulders','Back'],eq:['dumbbells'],type:'strength',compound:1,steps:['Stand tall with weights at sides.','Walk with short controlled steps.','Keep shoulders level and trunk braced.'],tips:['Great for strength and stamina together.']},
{id:'pallof_band',name:'Standing Band Pallof Press',p:'Core',s:['Shoulders'],eq:['bands','anchor'],type:'strength',compound:0,steps:['Anchor band at chest height and stand sideways.','Press hands straight out.','Resist rotation and return.'],tips:['Use a stance that feels stable.']},
{id:'brisk_walk',name:'Brisk Walk',p:'Calves',s:['Quadriceps','Glutes','Core'],eq:['outdoors'],type:'conditioning',time:5,steps:['Walk tall at a purposeful but sustainable pace.','Let arms swing naturally.','Choose a pace that raises breathing without making you unsteady.'],tips:['Flat route is always a valid substitute.']},
{id:'hill_walk',name:'Hill Walk',p:'Glutes',s:['Quadriceps','Calves','Core'],eq:['outdoors','hill'],type:'conditioning',time:4,steps:['Use short controlled steps.','Let the hill raise effort without rushing.','Turn around before fatigue changes balance or form.'],tips:['Swap to flat walking anytime.']},
{id:'stairs',name:'Stair Walk',p:'Quadriceps',s:['Glutes','Calves','Core'],eq:['stairs'],type:'conditioning',time:3,steps:['Use the railing whenever helpful.','Take controlled steps at a sustainable pace.','Keep effort steady rather than racing.'],tips:['Your apartment flight counts.']},
{id:'march',name:'Standing March',p:'Core',s:['Quadriceps','Calves'],eq:['bodyweight'],type:'conditioning',time:3,steps:['Stand tall near a support if helpful.','March at an easy steady pace.','Keep breathing comfortable.'],tips:['Use this when walking or stairs are not a good fit.']},
{id:'flat_walk',name:'Indoor or Flat Walk',p:'Calves',s:['Quadriceps','Glutes'],eq:['bodyweight'],type:'conditioning',time:5,steps:['Choose a clear, level route indoors or outside.','Walk at a comfortable pace with stable footing.','Slow down as needed to maintain balance.'],tips:['Keep this as easy or brisk as feels right.']},
{id:'side_steps',name:'Side Steps',p:'Glutes',s:['Quadriceps'],eq:['bodyweight'],type:'conditioning',time:3,steps:['Stand near a stable counter or wall.','Step sideways and bring the other foot in.','Continue slowly in both directions.'],tips:['Keep your knees soft and posture upright.']},
{id:'low_impact_jacks',name:'Low-Impact Step Jacks',p:'Core',s:['Calves','Shoulders'],eq:['bodyweight'],type:'conditioning',time:3,steps:['Step one foot out to the side while raising your arms comfortably.','Return to center and alternate sides.','Keep both feet close to the ground; never jump.'],tips:['Move arms only as high as comfortable.']},
{id:'mobility',name:'Standing Mobility Flow',p:'Core',s:['Shoulders','Glutes'],eq:['bodyweight'],type:'recovery',time:5,steps:['Move slowly through gentle shoulder, hip, and ankle ranges.','Keep every movement controlled.','Stay upright throughout.'],tips:['No head-below-heart positions.']}
];
const DEFAULT={version:3,profile:{goal:'Strength + Stamina',secondary:'Lose fat + health',duration:30,minStrength:3,maxStrength:5,rotationDays:28,protectTomorrow:true,location:'home',homeDB:[2,3],gymFullRack:true,gymBench:true,bands:true,bandAnchor:true,supports:['chair','mat','wall','counter','stairs','hill'],avoidHeadBelowHeart:true,avoidHeadFlat:true},readiness:{energy:'okay',soreness:'some',minutes:30,location:'home'},workouts:[],movements:[],favorites:[],customExercises:[],prefs:{},strength:{},muscleLoad:{},lastWorkoutId:null,coach:true,buildMode:'count',exerciseCount:6,workoutChoice:'strength',cardioMinutes:15,cardioCount:2,cardioActivity:'auto',restSeconds:30,repSeconds:5,voice:false};
let S=load(); let tab='today'; let activeWorkout=null; let coachIndex=0; let undoStack=[];
function snapshot(){if(activeWorkout){undoStack.push(JSON.stringify(activeWorkout));if(undoStack.length>20)undoStack.shift()}}
function undo(){if(!undoStack.length)return toast('Nothing to undo');activeWorkout=JSON.parse(undoStack.pop());saveActive();render()}
function saveActive(){try{if(activeWorkout)localStorage.setItem('forgefit-active',JSON.stringify(activeWorkout));else localStorage.removeItem('forgefit-active')}catch(e){}}
try{activeWorkout=JSON.parse(localStorage.getItem('forgefit-active')||'null')}catch(e){}
function chooseBuild(v){S.buildMode=v;save();render()}
function updateBuild(v){S.exerciseCount=Math.max(1,Math.min(20,+v||6));save()}
function toggleCoach(){S.coach=!S.coach;save();render()}
function estimatedSeconds(n){return n*3*10*(+S.repSeconds||5)+Math.max(0,n*3-1)*(+S.restSeconds||0)+n*12}
function alternate(items){let upper=items.filter(e=>!['Quadriceps','Hamstrings','Glutes','Calves'].includes(e.p)),lower=items.filter(e=>['Quadriceps','Hamstrings','Glutes','Calves'].includes(e.p)),out=[];while(upper.length||lower.length){if(upper.length)out.push(upper.shift());if(lower.length)out.push(lower.shift())}return out}
function saveRoutine(){if(!activeWorkout)return;const name=prompt('Name this favorite routine:',activeWorkout.title);if(!name)return;S.favorites=S.favorites||[];S.favorites.unshift({id:newID(),name,exercises:structuredClone(activeWorkout.exercises),kind:activeWorkout.kind});save();toast('Routine saved')}
function startRoutine(i){let r=(S.favorites||[])[i];if(!r)return;activeWorkout={id:newID(),date:new Date().toISOString(),kind:r.kind,title:r.name,minutes:0,completed:false,exercises:structuredClone(r.exercises).map(e=>({...e,sets:e.sets.map(x=>({...x,done:false})),feedback:null})),rationale:['Saved favorite routine']};coachIndex=0;saveActive();tab='today';render()}
function setNote(i,v){activeWorkout.exercises[i].techniqueNote=v;saveActive()}
function toggleChecklist(i,key,checked){activeWorkout.exercises[i].checklist=activeWorkout.exercises[i].checklist||{};activeWorkout.exercises[i].checklist[key]=checked;saveActive()}
function addCustom(){showModal(`<h2>Add your own exercise</h2><div class=field><label>Name</label><input id=cname placeholder="Exercise name"></div><div class=field><label>Primary muscle group</label><select id=cmuscle>${MUSCLES.map(m=>`<option>${m}</option>`).join('')}</select></div><div class=field><label>Equipment</label><select id=ceq><option value=bodyweight>Bodyweight</option><option value=dumbbells>Dumbbells</option><option value=bands>Resistance bands</option></select></div><div class=field><label>Instructions</label><input id=csteps placeholder="Technique and position cues"></div><button class=primary onclick="saveCustom()">Save exercise</button>`)}
function saveCustom(){const name=document.getElementById('cname').value.trim();if(!name)return toast('Enter a name');const m=document.getElementById('cmuscle').value, eq=document.getElementById('ceq').value,steps=document.getElementById('csteps').value.trim();S.customExercises=S.customExercises||[];S.customExercises.push({id:'custom_'+newID(),name,p:m,s:[],eq:[eq],type:'strength',compound:0,steps:[steps||'Move in a controlled way; adjust for comfort and stability.'],tips:['Confirm proper form for this custom movement.']});save();closeModal();render();toast('Custom exercise saved')}
function addExercise(){if(!activeWorkout)return;let used=new Set(activeWorkout.exercises.map(x=>x.id));let last=activeWorkout.exercises.at(-1),wasLower=last&&['Quadriceps','Hamstrings','Glutes','Calves'].includes(last.p);let candidates=library().filter(x=>x.type===activeWorkout.kind&&compatible(x)&&!used.has(x.id)&&(S.prefs[x.id]||'neutral')!=='never').sort((a,b)=>((['Quadriceps','Hamstrings','Glutes','Calves'].includes(a.p)===wasLower)?1:0)-((['Quadriceps','Hamstrings','Glutes','Calves'].includes(b.p)===wasLower)?1:0)||b.compound-a.compound);if(!candidates.length)return toast('No other compatible exercises');snapshot();activeWorkout.exercises.push(makeWorkoutEx(candidates[0]));saveActive();render()}
function recentWorkouts(){return S.workouts.filter(w=>w.completed&&daysAgo(w.date)>=0&&daysAgo(w.date)<=7).sort((a,b)=>new Date(b.date)-new Date(a.date))}
function recentWorkoutPicker(){const rows=recentWorkouts();showModal(`<h2>Repeat a workout</h2><p class=muted>Choose a workout from the past 7 days. Exercises, order, sets, and repetitions are copied; completed checkmarks are reset.</p>${rows.map(w=>`<div class=option onclick="repeatById('${w.id}')"><b>${escapeAttr(w.title)}</b><div class=small>${new Date(w.date).toLocaleDateString()} · ${w.exercises.length} exercises · ${w.exercises.map(e=>e.name).join(', ')}</div></div>`).join('')||'<p class=muted>No completed workouts from the last 7 days.</p>'}`)}
function repeatById(id){const w=recentWorkouts().find(x=>x.id===id);if(!w)return;activeWorkout={...structuredClone(w),id:newID(),date:new Date().toISOString(),completed:false,exercises:w.exercises.map(e=>({...e,sets:e.sets.map(x=>({...x,done:false})),feedback:null}))};coachIndex=0;saveActive();closeModal();tab='today';render()}
function repeatWorkout(){let last=S.workouts[0];if(!last)return;activeWorkout={...structuredClone(last),id:newID(),date:new Date().toISOString(),completed:false,exercises:last.exercises.map(e=>({...e,sets:e.sets.map(z=>({...z,done:false})),feedback:null}))};coachIndex=0;saveActive();tab='today';render()}
function editWorkout(){if(!activeWorkout)return;showModal(`<h2>Edit active workout</h2><div class=field><label>Number of different exercises</label><input id=editcount type=number min=1 max=20 value='${activeWorkout.exercises.length}'></div><div class=field><label>Rest (seconds, optional)</label><input id=editrest type=number min=0 max=300 value='${S.restSeconds}'></div><div class=field><label>Rep pace guide (seconds)</label><input id=editrep type=number min=0 max=15 value='${S.repSeconds}'></div><button class=primary onclick='applyWorkoutEdit()'>Apply changes</button>`) }
function applyWorkoutEdit(){if(!activeWorkout)return;let n=Math.max(1,Math.min(20,+document.getElementById('editcount').value||1));snapshot();S.restSeconds=Math.max(0,+document.getElementById('editrest').value||0);S.repSeconds=Math.max(0,+document.getElementById('editrep').value||0);while(activeWorkout.exercises.length>n)activeWorkout.exercises.pop();while(activeWorkout.exercises.length<n){let ids=new Set(activeWorkout.exercises.map(e=>e.id));let x=library().find(e=>e.type===activeWorkout.kind&&compatible(e)&&!ids.has(e.id));if(!x)break;activeWorkout.exercises.push(makeWorkoutEx(x))}coachIndex=Math.min(coachIndex,activeWorkout.exercises.length-1);save();saveActive();closeModal();render()}
function finishPrompt(){if(!activeWorkout)return;showModal(`<h2>Finish this workout?</h2><p>Great work. Form and control come before the clock.</p><button class=primary onclick='closeModal();completeWorkout()'>Finish and save summary</button><button class=secondary style='width:100%;margin-top:8px' onclick='closeModal();addExercise()'>Add another exercise</button><button class=secondary style='width:100%;margin-top:8px' onclick='closeModal();addExercise()'>Keep going — add another movement</button><button class=secondary style='width:100%;margin-top:8px' onclick='closeModal()'>Keep going — continue current workout</button>`)}
function load(){try{let x=JSON.parse(localStorage.getItem('forgefit'));return merge(DEFAULT,x)}catch(e){return structuredClone(DEFAULT)}}
function merge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a;if(a&&typeof a==='object'){const o={};for(const k in a)o[k]=merge(a[k],b?.[k]);for(const k in b||{})if(!(k in o))o[k]=b[k];return o}return b===undefined?a:b}
function save(){localStorage.setItem('forgefit',JSON.stringify(S))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function daysAgo(d){return (Date.now()-new Date(d).getTime())/864e5}
function muscleRecovery(m){const entries=S.workouts.filter(w=>w.completed).flatMap(w=>w.exercises.filter(e=>e.p===m||e.s.includes(m)).map(e=>({d:w.date,sets:e.sets.filter(s=>s.done).length,fb:e.feedback}))).sort((a,b)=>new Date(b.d)-new Date(a.d));if(!entries.length)return 100;const x=entries[0];const half= m==='Quadriceps'||m==='Glutes'||m==='Hamstrings'?50:38;let fatigue=Math.min(70,18+x.sets*9+(x.fb==='tooHard'?14:x.fb==='hard'?7:0));return Math.round(Math.min(100,Math.max(18,100-fatigue*Math.exp(-daysAgo(x.d)*24/half))))}
function readinessScore(){let v=70;if(S.readiness.energy==='low')v-=20;if(S.readiness.energy==='great')v+=15;if(S.readiness.soreness==='none')v+=10;if(S.readiness.soreness==='aLot')v-=25;return Math.max(0,Math.min(100,v))}
function weekStrengthCount(){const cutoff=Date.now()-7*864e5;return new Set(S.workouts.filter(w=>w.completed&&w.kind==='strength'&&new Date(w.date).getTime()>cutoff).map(w=>new Date(w.date).toDateString())).size}
function locationEq(){const l=S.readiness.location;if(l==='gym')return ['bodyweight','dumbbells','bench','bands','anchor','stairs'];if(l==='outdoors')return ['bodyweight','outdoors','hill','stairs'];return ['bodyweight','dumbbells','bands','anchor','counter','stairs'];}
function compatible(ex){const e=locationEq();return ex.eq.every(q=>e.includes(q)||q==='dumbbells'&&e.includes('dumbbells'))}
function library(){return [...EX,...(S.customExercises||[])]}
function preferenceScore(ex){const p=S.prefs[ex.id]||'neutral';return p==='more'?18:p==='less'?-15:p==='never'?-999:0}
function recentPenalty(ex){const recent=S.workouts.filter(w=>w.completed&&daysAgo(w.date)<7).flatMap(w=>w.exercises.map(e=>e.id));const n=recent.filter(id=>id===ex.id).length;return Math.min(14,n*2)}
function chooseKind(){if(S.readiness.location==='outdoors')return readinessScore()<55?'recovery':'conditioning';if(S.readiness.energy==='low'||S.readiness.soreness==='aLot'||readinessScore()<48)return 'recovery';const n=weekStrengthCount();if(n<S.profile.minStrength)return 'strength';if(n>=S.profile.maxStrength)return readinessScore()>72?'conditioning':'recovery';return readinessScore()>=62?'strength':'conditioning'}
function targetWeight(ex){if(!ex.eq.includes('dumbbells'))return 0;const hist=S.strength[ex.id];let raw=hist?.nextWeight||0;if(!raw){raw=S.readiness.location==='gym'?5:(S.profile.homeDB.includes(3)?3:2)}if(S.readiness.location==='home'){const vals=S.profile.homeDB.slice().sort((a,b)=>a-b);return vals.reduce((best,v)=>Math.abs(v-raw)<Math.abs(best-raw)?v:best,vals[0]||0)}return Math.max(5,Math.round(raw/5)*5)}
function buildCardioItems(targetMinutes,count){
 const pool=library().filter(x=>x.type==='conditioning'&&compatible(x)&&(S.prefs[x.id]||'neutral')!=='never');
 const fallback=library().filter(x=>x.type==='conditioning'&&['flat_walk','march','side_steps','low_impact_jacks'].includes(x.id));
 let options=pool.length?pool:fallback;
 if(S.cardioActivity&&S.cardioActivity!=='auto'){
   const chosen=library().find(x=>x.id===S.cardioActivity);
   if(chosen&&chosen.type==='conditioning'&&compatible(chosen))options=[chosen,...options.filter(x=>x.id!==chosen.id)];
 }
 const n=Math.max(1,Math.min(12,count||2));
 const selected=options.slice(0,n);
 const per=Math.max(1,Math.floor(targetMinutes/selected.length));
 return selected.map((ex,i)=>({...makeWorkoutEx(ex),sets:[{minutes:per+(i===0?targetMinutes-per*selected.length:0),done:false}]}));
}
function generate(){
 const choice=S.workoutChoice||'strength';
 const minutes=S.readiness.energy==='low'?Math.min(10,+S.readiness.minutes||10):(+S.readiness.minutes||30);
 let items=[];
 if(choice!=='cardio'){
  const desired=S.buildMode==='count'?Math.max(1,Math.min(20,+S.exerciseCount||6)):Math.max(1,Math.min(20,Math.floor((minutes*60)/((3*10*(+S.repSeconds||5))+(2*(+S.restSeconds||0))+12))));
  const muscles=MUSCLES.map(m=>({m,r:muscleRecovery(m)})).sort((a,b)=>b.r-a.r);let lowerUsed=0;
  for(const mm of muscles){if(items.length>=desired)break;const lower=['Quadriceps','Hamstrings','Glutes','Calves'].includes(mm.m);if(lower&&S.profile.protectTomorrow&&lowerUsed>=Math.max(2,Math.ceil(desired/2)))continue;
   const cand=library().filter(x=>x.type==='strength'&&x.p===mm.m&&compatible(x)&&(S.prefs[x.id]||'neutral')!=='never').map(x=>({x,score:mm.r+preferenceScore(x)-recentPenalty(x)+(x.compound?4:0)+Math.random()*2})).sort((a,b)=>b.score-a.score)[0]?.x;
   if(cand){items.push(makeWorkoutEx(cand));if(lower)lowerUsed++}}
  if(items.length<desired)library().filter(x=>x.type==='strength'&&compatible(x)&&!items.some(y=>y.id===x.id)&&(S.prefs[x.id]||'neutral')!=='never').sort((a,b)=>b.compound-a.compound).slice(0,desired-items.length).forEach(x=>items.push(makeWorkoutEx(x)));
  items=alternate(items);
 }
 const cardioDuration=Math.max(3,Math.min(90,+S.cardioMinutes||15));
 if(choice!=='strength')items.push(...buildCardioItems(choice==='cardio'?(S.buildMode==='time'?minutes:cardioDuration):cardioDuration,+S.cardioCount||2));
 if(!items.length)return toast('No compatible exercises available');
 const kind=choice==='cardio'?'conditioning':choice==='both'?'combined':'strength';
 activeWorkout={id:newID(),date:new Date().toISOString(),kind,title:choice==='cardio'?'Cardio Workout':choice==='both'?'Strength + Cardio':'Adaptive Strength',minutes,completed:false,exercises:items,rationale:[...reasonText(kind),choice==='both'?'Strength and cardio selections are independent.':'Pace and rest are always adjustable.']};
 coachIndex=0;saveActive();render();
}
function reasonText(kind){const r=[];if(kind==='strength')r.push(`${weekStrengthCount()} strength days completed in the last 7 days; target is ${S.profile.minStrength}–${S.profile.maxStrength}.`);r.push(`Today's readiness is ${readinessScore()}/100.`);if(S.profile.protectTomorrow)r.push('Lower-body volume is capped to protect tomorrow.');r.push(`Equipment is filtered for ${locName(S.readiness.location)}.`);return r}
function makeWorkoutEx(ex){if(ex.type!=='strength')return {...ex,sets:[{minutes:ex.time||4,done:false}],feedback:null};const reps=ex.compound?8:10;const setCount=S.readiness.soreness==='aLot'?1:(S.profile.protectTomorrow&&['Quadriceps','Glutes','Hamstrings'].includes(ex.p)?2:3);const wt=targetWeight(ex);return {...ex,sets:Array.from({length:setCount},()=>({reps,weight:wt,done:false})),feedback:null}}
function locName(l){return l==='gym'?'Apartment Gym':l==='outdoors'?'Outdoors':'Home'}
function completeWorkout(){if(!activeWorkout)return;activeWorkout.completed=true;activeWorkout.exercises.forEach(e=>{if(e.type==='strength'){const done=e.sets.filter(s=>s.done);if(done.length){const last=done[done.length-1];const fb=e.feedback;let next=last.weight;if(fb==='easy')next*=1.08;else if(fb==='right')next*=1.03;else if(fb==='hard')next*=1;else if(fb==='tooHard')next*=.9;S.strength[e.id]={lastWeight:last.weight,nextWeight:Math.max(0,Math.round(next*2)/2),date:new Date().toISOString(),bestReps:Math.max(...done.map(s=>s.reps))}}}});S.workouts.unshift(activeWorkout);S.lastWorkoutId=activeWorkout.id;save();activeWorkout=null;saveActive();showModal(`<h2>Workout summary</h2><p>${S.workouts[0].exercises.length} exercises · ${S.workouts[0].exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)} logged sets</p><p>Completed reps: ${S.workouts[0].exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).reduce((v,z)=>v+(z.reps||0),0),0)}</p><p>Good form matters more than duration.</p>`);tab='today';render()}
function alternatives(id){const cur=(activeWorkout?.exercises||[]).find(e=>e.id===id);if(!cur)return[];let a=library().filter(x=>x.id!==id&&compatible(x)&&(S.prefs[x.id]||'neutral')!=='never');if(cur.type==='strength')a=a.filter(x=>x.type==='strength'&&x.p===cur.p);else a=a.filter(x=>x.type==='conditioning');return a.slice(0,5)}
function swap(oldId,newId){const i=activeWorkout.exercises.findIndex(e=>e.id===oldId);const ex=library().find(x=>x.id===newId);if(i>=0&&ex){snapshot();activeWorkout.exercises[i]=makeWorkoutEx(ex);saveActive();closeModal();toast('Exercise swapped');render()}}
function showAlternatives(id){const cur=activeWorkout.exercises.find(e=>e.id===id);const a=alternatives(id);showModal(`<h2>Alternative</h2><p class="muted">Replace <b>${cur.name}</b> with:</p>${a.map(x=>`<div class="option" onclick="swap('${id}','${x.id}')"><b>${x.name}</b><div class="small muted">${x.p} · ${x.eq.join(', ')}</div></div>`).join('')||'<div class="empty">No good alternative found for this location.</div>'}`)}
function showModal(html){document.getElementById('sheet').innerHTML=html+`<button class="secondary" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function updateSet(ei,si,key,val){snapshot();activeWorkout.exercises[ei].sets[si][key]=key==='done'?val:(+val||0);saveActive();if(key==='done')render()}
function setFeedback(ei,val){snapshot();activeWorkout.exercises[ei].feedback=val;saveActive();renderWorkoutOnly()}
function renderWorkoutOnly(){render()}

${activeWorkout?workoutView():`<section class="card"><div class="row"><div><div class="eyebrow">Daily readiness</div><h2 style="margin-bottom:4px">How are you today?</h2></div><div class="big-num">${readinessScore()}</div></div><div class="bar"><span style="width:${readinessScore()}%"></span></div><div class="hr"></div>${readinessControls()}<button class="primary" onclick="generate()">Build today's workout</button><p class="small muted">Low energy? A short, gentle movement session still counts. Form matters more than pace.</p>${recentWorkouts().length?`<button class="secondary" style="width:100%;margin-top:8px" onclick="recentWorkoutPicker()">Repeat one of the last 7 days</button>`:''}<details class="details"><summary>How ForgeFit decides</summary><p class="small muted" style="margin-top:9px">It combines your strength-day target, muscle recovery, recent performance, simple effort feedback, exercise preferences, available equipment, location, and today's energy/soreness. Your own check-in outranks phone data.</p></details></section>`}
<section class="card"><div class="row"><div><div class="eyebrow">Purposeful movement</div><h3>Phone wasn't with you?</h3></div><button class="secondary" onclick="movementModal()">Log movement</button></div><p class="small muted">Walking, stairs, hills, mobility, or another purposeful session still counts even when your phone didn't record it.</p></section>${last?`<section class="card"><div class="eyebrow">Most recent</div><h3>${last.title}</h3><p class="muted small">${new Date(last.date).toLocaleDateString()} · ${last.exercises.length} activities</p></section>`:''}<section class="card install"><b>Add ForgeFit to your iPhone:</b> in Safari tap <b>Share</b> → <b>Add to Home Screen</b>. It will open full-screen like an app.</section></div>`}
function readinessControls(){return `<div class="field"><label>Workout type</label><div class="seg">${[['strength','💪 Strength only'],['cardio','❤️ Cardio only'],['both','💪 + ❤️ Both']].map(x=>`<button class="${(S.workoutChoice||'strength')===x[0]?'active':''}" onclick="S.workoutChoice='${x[0]}';save();render()">${x[1]}</button>`).join('')}</div></div>${S.workoutChoice!=='strength'?`<div class="grid2"><div class="field"><label>Cardio minutes</label><select onchange="S.cardioMinutes=+this.value;save()">${[5,10,15,20,25,30,40,45,60].map(n=>`<option value="${n}" ${S.cardioMinutes==n?'selected':''}>${n} min</option>`).join('')}</select></div><div class="field"><label>Cardio activities</label><select onchange="S.cardioCount=+this.value;save()">${[1,2,3,4,5].map(n=>`<option value="${n}" ${S.cardioCount==n?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="field"><label>Preferred cardio activity</label><select onchange="S.cardioActivity=this.value;save()"><option value="auto">Mix activities for me</option>${library().filter(x=>x.type==='conditioning').map(x=>`<option value="${x.id}" ${S.cardioActivity===x.id?'selected':''}>${x.name}</option>`).join('')}</select></div>`:''}<div class="field"><label>Energy</label><div class="seg">${['low','okay','great'].map(x=>`<button class="${S.readiness.energy===x?'active':''}" onclick="S.readiness.energy='${x}';save();render()">${x==='okay'?'Okay':cap(x)}</button>`).join('')}</div></div><div class="field"><label>Soreness</label><div class="seg">${[['none','None'],['some','Some'],['aLot','A lot']].map(x=>`<button class="${S.readiness.soreness===x[0]?'active':''}" onclick="S.readiness.soreness='${x[0]}';save();render()">${x[1]}</button>`).join('')}</div></div><div class="field"><label>Build workout by</label><div class="seg"><button class="${S.buildMode==='count'?'active':''}" onclick="chooseBuild('count')">Number of exercises</button><button class="${S.buildMode==='time'?'active':''}" onclick="chooseBuild('time')">Time</button></div></div>${S.workoutChoice!=='cardio'&&S.buildMode==='count'?`<div class="field"><label>Different exercises</label><select onchange="updateBuild(this.value)">${[2,3,4,5,6,7,8,10,12,15,20].map(n=>`<option value="${n}" ${S.exerciseCount==n?'selected':''}>${n} exercises</option>`).join('')}</select></div>`:''}<div class="grid2"><div class="field"><label>Time ${S.buildMode==='count'?'(informational)':''}</label><select onchange="S.readiness.minutes=+this.value;save()">${[10,20,30,40,45].map(x=>`<option ${S.readiness.minutes==x?'selected':''} value="${x}">${x} min</option>`).join('')}</select></div><div class="field"><label>Where</label><select onchange="S.readiness.location=this.value;save();render()"><option value="home" ${S.readiness.location==='home'?'selected':''}>Home</option><option value="gym" ${S.readiness.location==='gym'?'selected':''}>Apartment Gym</option><option value="outdoors" ${S.readiness.location==='outdoors'?'selected':''}>Outdoors</option></select></div></div>`}

function demoMedia(e){
  const q=encodeURIComponent(e.name+' exercise proper form');
  const image=EMBEDDED_EXERCISE_ART[e.id];
  const supplementary='https://www.youtube.com/results?search_query='+q;
  return `<div class="demo-media"><b>Movement demonstration</b>${image?`<img class="exercise-illustration" src="${image}" alt="Start and finish illustrated guide for ${escapeAttr(e.name)}">`:'<p>Custom exercise: add your own demonstration image later.</p>'}<p class="small muted">Illustrated sequence is a simplified position guide. Follow the written technique instructions and your comfortable range.</p><a class="media-link" href="${supplementary}" target="_blank" rel="noopener noreferrer">Watch an additional demonstration ↗</a></div>`;
}

function coachView(w){const e=w.exercises[Math.min(coachIndex,w.exercises.length-1)];const i=w.exercises.indexOf(e);return `<div class="container" style="padding-top:0"><section class="card coach"><div class="row"><span class="badge">${i+1} of ${w.exercises.length}</span><button class="secondary" onclick="showAlternatives('${e.id}')">Swap exercise</button></div><div class="eyebrow" style="margin-top:16px">${e.p}</div><h2 style="font-size:27px">${e.name}</h2>${demoMedia(e)}${setsHTML(e,i)}<details class="details"><summary>How to do it</summary><ol class="list small">${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol>${e.tips?.length?`<div class="notice">${e.tips.join(' ')}</div>`:''}</details>${e.type==='strength'?feedbackHTML(e,i):''}<div class="coach-nav"><button class="secondary" ${i===0?'disabled':''} onclick="coachIndex=Math.max(0,coachIndex-1);render()">Back</button><button class="secondary" ${i===w.exercises.length-1?'disabled':''} onclick="coachIndex=Math.min(${w.exercises.length-1},coachIndex+1);render()">Next</button></div></section></div>`}
function fullView(w){return `<div class="container" style="padding-top:0">${w.exercises.map((e,i)=>`<section class="workout-card"><div class="row"><div><div class="exercise-title">${e.name}</div><span class="badge">${e.p}</span></div><button class="secondary" onclick="showAlternatives('${e.id}')">Swap exercise</button></div>${demoMedia(e)}${setsHTML(e,i)}<details class="details"><summary>Technique</summary><ol class="list small">${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol></details>${e.type==='strength'?feedbackHTML(e,i):''}</section>`).join('')}</div>`}
function setsHTML(e,ei){if(e.type!=='strength')return `<div class="sets"><label class="check"><input type="checkbox" ${e.sets[0].done?'checked':''} onchange="updateSet(${ei},0,'done',this.checked)"><span><b>${e.sets[0].minutes} minutes</b> · mark complete</span></label></div>`;return `<div class="sets">${e.sets.map((s,si)=>`<div class="setrow"><b>${si+1}</b><input aria-label="weight" type="number" inputmode="decimal" value="${s.weight}" onchange="updateSet(${ei},${si},'weight',this.value)"><input aria-label="reps" type="number" inputmode="numeric" value="${s.reps}" onchange="updateSet(${ei},${si},'reps',this.value)"><input type="checkbox" ${s.done?'checked':''} onchange="updateSet(${ei},${si},'done',this.checked)"></div>`).join('')}<div class="small muted">Weight · reps · ✓</div></div>`}
function feedbackHTML(e,ei){return `<div class="details"><details><summary>Technique notes and form checklist</summary><label class=check><input type=checkbox ${e.checklist?.controlled?'checked':''} onchange="toggleChecklist(${ei},'controlled',this.checked)">Controlled movement</label><label class=check><input type=checkbox ${e.checklist?.stable?'checked':''} onchange="toggleChecklist(${ei},'stable',this.checked)">Stable position</label><label class=check><input type=checkbox ${e.checklist?.comfortable?'checked':''} onchange="toggleChecklist(${ei},'comfortable',this.checked)">Comfortable range</label><div class=field><label>My notes</label><input value="${escapeAttr(e.techniqueNote||'')}" onchange="setNote(${ei},this.value)" placeholder="How the movement felt"></div></details><b>How was that?</b><div class="feedback">${[['easy','Too easy'],['right','Just right'],['hard','Hard but doable'],['tooHard','Too hard']].map(x=>`<button class="${e.feedback===x[0]?'selected':''}" onclick="setFeedback(${ei},'${x[0]}')">${x[1]}</button>`).join('')}</div></div>`}
function history(){return `<div class="container"><section class="card"><div class="eyebrow">History</div><h1>Your work counts.</h1><p class="muted">Completed workouts and manually logged purposeful movement.</p></section>${S.workouts.length?S.workouts.map(w=>`<section class="card"><div class="row"><div><h3>${w.title}</h3><div class="small muted">${new Date(w.date).toLocaleString()} · ${w.kind}</div></div><span class="pill">${w.exercises.length} items</span></div><div class="small">${w.exercises.map(e=>e.name).join(' · ')}</div></section>`).join(''):'<div class="empty">No workouts saved yet.</div>'}${S.movements.map(m=>`<section class="card"><h3>${m.type}</h3><div class="small muted">${new Date(m.date).toLocaleString()} · ${m.minutes} min</div>${m.note?`<p class="small">${m.note}</p>`:''}</section>`).join('')}</div>`}
function progress(){const total=S.workouts.length;const week=weekStrengthCount();const mastered=Object.keys(S.strength).length;const rec=MUSCLES.map(m=>({m,r:muscleRecovery(m)}));return `<div class="container"><section class="card"><div class="eyebrow">Progress</div><h1>Capability over punishment.</h1><p class="muted">ForgeFit emphasizes consistency, strength progress, stamina, and how you feel—not just scale weight.</p><div class="grid3"><div class="stat"><strong>${total}</strong><span class="small muted">Workouts</span></div><div class="stat"><strong>${week}</strong><span class="small muted">Strength / 7d</span></div><div class="stat"><strong>${mastered}</strong><span class="small muted">Tracked lifts</span></div></div></section><section class="card"><h3>Estimated muscle recovery</h3><p class="small muted">Based on logged workouts, not a measurement of how recovered a muscle actually is.</p>${rec.map(x=>`<div class="progress-row"><div class="row small"><b>${x.m}</b><span>${x.r}%</span></div><div class="bar"><span style="width:${x.r}%"></span></div></div>`).join('')}</section><section class="card"><h3>Strength and repetition history</h3>${library().filter(x=>x.type==='strength').map(e=>{const rows=S.workouts.filter(w=>w.completed).flatMap(w=>w.exercises.filter(x=>x.id===e.id).map(x=>({date:w.date,sets:x.sets.filter(t=>t.done)}))).filter(x=>x.sets.length);return {e,rows}}).filter(x=>x.rows.length).map(({e,rows})=>`<details class=details><summary>${escapeAttr(e.name)} · ${rows.length} sessions</summary>${rows.slice(0,12).map(r=>`<div class=small style="margin:7px 0">${new Date(r.date).toLocaleDateString()}: ${r.sets.map(t=>`${t.reps} reps @ ${t.weight} lb`).join(' / ')}</div>`).join('')}<div class=bar><span style="width:${Math.min(100,rows.length*12)}%"></span></div></details>`).join('')||'<p class=muted>No completed sets yet.</p>'}</section><section class="card"><h3>Strength estimates</h3>${Object.keys(S.strength).length?Object.entries(S.strength).map(([id,v])=>{const ex=library().find(x=>x.id===id);return `<div class="row" style="padding:8px 0"><span>${ex?.name||id}</span><b>${v.nextWeight} lb next</b></div>`}).join(''):'<p class="muted small">Finish some strength workouts and ForgeFit will begin adapting recommended loads.</p>'}</section></div>`}
function settings(){return `<div class="container"><section class="card"><div class="eyebrow">Your plan</div><h1>Personalized for you</h1><div class="field"><label>Default workout length</label><select onchange="S.profile.duration=+this.value;S.readiness.minutes=+this.value;save()">${[20,30,35,40,45].map(x=>`<option ${S.profile.duration==x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Minimum strength days</label><input type="number" min="1" max="6" value="${S.profile.minStrength}" onchange="S.profile.minStrength=+this.value;save()"></div><div class="field"><label>Maximum strength days</label><input type="number" min="1" max="7" value="${S.profile.maxStrength}" onchange="S.profile.maxStrength=+this.value;save()"></div></div><label class="check"><input type="checkbox" ${S.profile.protectTomorrow?'checked':''} onchange="S.profile.protectTomorrow=this.checked;save()"><span><b>Protect tomorrow</b><br><span class="small muted">Cap lower-body dose so strength work doesn't routinely make the next morning miserable.</span></span></label></section><section class="card"><h3>Workout controls</h3><div class="field"><label>Default rest between sets (seconds)</label><input type="number" min="0" max="300" value="${S.restSeconds}" onchange="S.restSeconds=Math.max(0,+this.value||0);save()"></div><div class="field"><label>Optional pace guide per rep (seconds)</label><input type="number" min="0" max="15" value="${S.repSeconds}" onchange="S.repSeconds=Math.max(0,+this.value||0);save()"></div></section><section class="card"><h3>Favorite routines</h3>${(S.favorites||[]).length?(S.favorites||[]).map((r,i)=>`<div class="row option"><span><b>${escapeAttr(r.name)}</b><div class=small>${r.exercises.length} exercises</div></span><button class=secondary onclick="startRoutine(${i})">Start</button></div>`).join(''):'<p class=small muted>Save a workout as a routine while exercising.</p>'}</section><section class="card"><h3>Custom exercise library</h3><button class=secondary onclick="addCustom()">+ Add custom exercise</button>${(S.customExercises||[]).map(e=>`<div class=option><b>${escapeAttr(e.name)}</b><div class=small>${e.p} · ${e.eq.join(', ')}</div></div>`).join('')}</section><section class="card"><h3>Equipment profiles</h3><p class="small"><b>Home:</b> 2 lb + 3 lb dumbbells, therapy bands (all intensities), chair, mat, wall, countertop, stairs, nearby hill.</p><p class="small"><b>Apartment gym:</b> full dumbbell rack + adjustable bench.</p><p class="small"><b>Bands:</b> can be tied into loops and securely anchored.</p></section><section class="card"><h3>Position rules</h3><div class="notice"><b>Never generate:</b> head below heart or head flat on the floor. Flat bench work is excluded. Inclined/upright supported work is allowed.</div></section><section class="card"><h3>Exercise preferences</h3><p class="muted small">Tap any exercise to tell ForgeFit to show it more, less, or never. Lunges are not restricted.</p>${library().filter(x=>x.type==='strength').map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #f2f4f7"><span>${x.name}</span><select style="width:120px;padding:7px;border:1px solid var(--line);border-radius:9px" onchange="S.prefs['${x.id}']=this.value;save()"><option value="neutral" ${(S.prefs[x.id]||'neutral')==='neutral'?'selected':''}>Neutral</option><option value="more" ${S.prefs[x.id]==='more'?'selected':''}>More</option><option value="less" ${S.prefs[x.id]==='less'?'selected':''}>Less</option><option value="never" ${S.prefs[x.id]==='never'?'selected':''}>Never</option></select></div>`).join('')}</section><section class="card"><h3>Data</h3><button class="secondary" onclick="exportData()">Export backup</button> <button class="secondary danger" onclick="if(confirm('Reset all ForgeFit data?')){localStorage.removeItem('forgefit');localStorage.removeItem('forgefit-active');location.reload()}">Reset</button><p class="small muted" style="margin-top:10px">Your workout history is stored in Safari on this iPhone. This version does not have HealthKit access.</p></section></div>`}
function movementModal(){showModal(`<h2>Log movement</h2><div class="field"><label>Type</label><select id="mvtype"><option>Walk</option><option>Hill walk</option><option>Stairs</option><option>Mobility</option><option>Other purposeful movement</option></select></div><div class="field"><label>Minutes</label><input id="mvmin" type="number" value="20"></div><div class="field"><label>Optional note</label><input id="mvnote" placeholder="How it felt, route, etc."></div><button class="primary" onclick="logMovement()">Save movement</button>`)}
function logMovement(){S.movements.unshift({id:newID(),date:new Date().toISOString(),type:document.getElementById('mvtype').value,minutes:+document.getElementById('mvmin').value||0,note:document.getElementById('mvnote').value});save();closeModal();toast('Movement saved');render()}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ForgeFit-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function escapeAttr(s){return String(s).replaceAll("&","&amp;").replaceAll("\"","&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function render(){document.getElementById('headerMode').textContent=activeWorkout?(activeWorkout.kind==='strength'?'Strength':activeWorkout.kind==='conditioning'?'Cardio':activeWorkout.kind==='combined'?'Strength + Cardio':'Recovery'):'Adaptive';document.getElementById('app').innerHTML=tab==='today'?today():tab==='history'?history():tab==='progress'?progress():settings();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script>
</body>
</html>
