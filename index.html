in-bottom:2px}.nav button.active{color:var(--brand);font-weight:800}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 14px;border-radius:999px;z-index:50;max-width:88%;text-align:center;box-shadow:var(--shadow)}.empty{padding:28px;text-align:center;color:var(--muted)}.tag{display:inline-block;margin:3px 4px 3px 0;padding:5px 8px;border-radius:999px;background:#f2f4f7;font-size:12px}.progress-row{margin:10px 0}.small{font-size:13px}.hr{height:1px;background:var(--line);margin:14px 0}.notice{padding:10px 12px;background:#fff8eb;border:1px solid #fedf89;border-radius:12px;color:#7a4b00;font-size:13px}.success{background:#ecfdf3;border-color:#abefc6;color:#067647}.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:60;display:flex;align-items:flex-end}.sheet{width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));}.sheet h2{margin-bottom:6px}.option{padding:13px;border:1px solid var(--line);border-radius:14px;margin:8px 0}.option:active{background:#f9fafb}.install{font-size:13px}.chipline{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:999px;background:#f2f4f7;font-size:13px;font-weight:700}.coach-nav{display:flex;gap:8px;margin-top:14px}.coach-nav button{flex:1}.green{color:var(--good)}

<script>
const MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Quadriceps','Hamstrings','Glutes','Calves','Core'];
const EX=[
{id:'incline_pushup',name:'Incline Push-Up',p:'Chest',s:['Triceps','Shoulders'],eq:['bodyweight','counter','bench'],type:'strength',compound:1,steps:['Place hands on a stable counter or inclined bench.','Keep ribs stacked and body long.','Lower chest toward the surface, then press away.'],tips:['Higher surface = easier.','Keep your head above your heart.']},
{id:'incline_db_press',name:'Incline Dumbbell Press',p:'Chest',s:['Shoulders','Triceps'],eq:['dumbbells','bench'],type:'strength',compound:1,steps:['Set the bench to a comfortable incline.','Lower dumbbells beside your chest under control.','Press up while keeping your head and upper body elevated.'],tips:['Do not set the bench flat.']},
{id:'band_press',name:'Standing Band Chest Press',p:'Chest',s:['Triceps','Shoulders'],eq:['bands','anchor'],type:'strength',compound:1,steps:['Anchor the band securely behind you.','Stand tall with staggered feet.','Press forward and return slowly.'],tips:['Use a lighter band if shoulders take over.']},
{id:'db_row',name:'Supported One-Arm Dumbbell Row',p:'Back',s:['Biceps'],eq:['dumbbells','bench'],type:'strength',compound:1,steps:['Brace one hand on the bench while staying comfortably upright.','Pull elbow toward hip.','Lower under control.'],tips:['Keep your head comfortably above your heart.']},
{id:'band_row',name:'Standing Resistance Band Row',p:'Back',s:['Biceps'],eq:['bands','anchor'],type:'strength',compound:1,steps:['Anchor band at chest height.','Pull elbows toward ribs.','Return slowly without shrugging.'],tips:['Pause briefly at the back.']},
{id:'band_pull_apart',name:'Band Pull-Apart',p:'Back',s:['Shoulders'],eq:['bands'],type:'strength',compound:0,steps:['Hold band at chest height.','Pull hands apart with soft elbows.','Return slowly.'],tips:['Keep shoulders down.']},
{id:'seated_db_press',name:'Seated Dumbbell Shoulder Press',p:'Shoulders',s:['Triceps'],eq:['dumbbells','bench'],type:'strength',compound:1,steps:['Set bench upright or high incline.','Start dumbbells near shoulder level.','Press overhead and lower with control.'],tips:['Stay upright with head supported if comfortable.']},
{id:'standing_db_press',name:'Standing Dumbbell Shoulder Press',p:'Shoulders',s:['Triceps','Core'],eq:['dumbbells'],type:'strength',compound:1,steps:['Stand tall and brace.','Press dumbbells overhead.','Lower slowly to shoulder level.'],tips:['Use light weights until balance feels automatic.']},
{id:'band_lateral_raise',name:'Standing Band Lateral Raise',p:'Shoulders',s:[],eq:['bands'],type:'strength',compound:0,steps:['Stand on the band.','Raise arms to a comfortable level.','Lower slowly.'],tips:['Keep the movement smooth, not jerky.']},
{id:'db_curl',name:'Dumbbell Curl',p:'Biceps',s:[],eq:['dumbbells'],type:'strength',compound:0,steps:['Stand tall with weights at sides.','Curl without swinging.','Lower fully under control.'],tips:['Keep elbows near your ribs.']},
{id:'band_curl',name:'Standing Band Curl',p:'Biceps',s:[],eq:['bands'],type:'strength',compound:0,steps:['Stand on the middle of the band.','Curl while keeping elbows near sides.','Lower slowly.'],tips:['Adjust band length to change resistance.']},
{id:'band_pressdown',name:'Band Triceps Pressdown',p:'Triceps',s:[],eq:['bands','anchor'],type:'strength',compound:0,steps:['Anchor the band securely above head height.','Keep elbows near ribs.','Press down and return slowly.'],tips:['Use a lighter band if shoulders begin helping.']},
{id:'db_triceps_kickback',name:'Supported Dumbbell Triceps Kickback',p:'Triceps',s:[],eq:['dumbbells','bench'],type:'strength',compound:0,steps:['Support one hand on bench and keep torso at a comfortable upright angle.','Keep upper arm still.','Straighten elbow and return slowly.'],tips:['Choose a torso angle that keeps your head above your heart.']},
{id:'goblet_squat',name:'Goblet Squat',p:'Quadriceps',s:['Glutes','Core'],eq:['dumbbells'],type:'strength',compound:1,steps:['Hold one dumbbell at chest height.','Sit down between your hips with full-foot pressure.','Stand smoothly.'],tips:['Use a chair target if helpful.']},
{id:'air_squat',name:'Bodyweight Squat',p:'Quadriceps',s:['Glutes','Core'],eq:['bodyweight'],type:'strength',compound:1,steps:['Stand at a comfortable width.','Sit down and back between hips.','Stand with knees tracking over toes.'],tips:['Use a chair behind you for confidence or depth control.']},
{id:'reverse_lunge',name:'Reverse Lunge',p:'Quadriceps',s:['Glutes','Hamstrings'],eq:['bodyweight'],type:'strength',compound:1,steps:['Step one foot backward.','Lower under control.','Drive through the front foot to return.'],tips:['Hold a counter or wall for balance if wanted.']},
{id:'stepup',name:'Step-Up',p:'Glutes',s:['Quadriceps','Hamstrings'],eq:['stairs','dumbbells'],type:'strength',compound:1,steps:['Place full foot on a stable step.','Drive through the working leg.','Lower with control.'],tips:['Use railing/support whenever helpful.']},
{id:'db_rdl',name:'Dumbbell Romanian Deadlift',p:'Hamstrings',s:['Glutes','Back'],eq:['dumbbells'],type:'strength',compound:1,steps:['Keep dumbbells close to legs.','Push hips back with soft knees while keeping your head above heart level.','Stand tall by squeezing glutes.'],tips:['Use a shallow range if needed to respect your position rule.']},
{id:'standing_leg_curl',name:'Standing Band Leg Curl',p:'Hamstrings',s:['Glutes'],eq:['bands','anchor'],type:'strength',compound:0,steps:['Anchor band low around one ankle.','Hold a stable support if helpful.','Bring heel toward glute and return slowly.'],tips:['Keep thighs mostly aligned.']},
{id:'band_kickback',name:'Standing Band Glute Kickback',p:'Glutes',s:['Hamstrings'],eq:['bands','anchor'],type:'strength',compound:0,steps:['Anchor band low around one ankle.','Stand tall holding support if helpful.','Drive leg backward without arching your back.'],tips:['Use a smaller range if balance becomes limiting.']},
{id:'band_lateral',name:'Tied-Band Lateral Walk',p:'Glutes',s:['Quadriceps'],eq:['bands'],type:'strength',compound:1,steps:['Tie the therapy band securely into a loop.','Keep a small bend in your knees.','Take controlled side steps with steady band tension.'],tips:['Use a wall or counter for light support.']},
{id:'calf_raise',name:'Standing Calf Raise',p:'Calves',s:[],eq:['bodyweight'],type:'strength',compound:0,steps:['Rise onto the balls of your feet.','Pause at the top.','Lower slowly.'],tips:['Hold a wall or counter as needed.']},
{id:'farmer_carry',name:'Farmer Carry',p:'Core',s:['Shoulders','Back'],eq:['dumbbells'],type:'strength',compound:1,steps:['Stand tall with weights at sides.','Walk with short controlled steps.','Keep shoulders level and trunk braced.'],tips:['Great for strength and stamina together.']},
{id:'pallof_band',name:'Standing Band Pallof Press',p:'Core',s:['Shoulders'],eq:['bands','anchor'],type:'strength',compound:0,steps:['Anchor band at chest height and stand sideways.','Press hands straight out.','Resist rotation and return.'],tips:['Use a stance that feels stable.']},
{id:'brisk_walk',name:'Brisk Walk',p:'Calves',s:['Quadriceps','Glutes','Core'],eq:['outdoors'],type:'conditioning',time:5,steps:['Walk tall at a purposeful but sustainable pace.','Let arms swing naturally.','Choose a pace that raises breathing without making you unsteady.'],tips:['Flat route is always a valid substitute.']},
{id:'hill_walk',name:'Hill Walk',p:'Glutes',s:['Quadriceps','Calves','Core'],eq:['outdoors','hill'],type:'conditioning',time:4,steps:['Use short controlled steps.','Let the hill raise effort without rushing.','Turn around before fatigue changes balance or form.'],tips:['Swap to flat walking anytime.']},
{id:'stairs',name:'Stair Walk',p:'Quadriceps',s:['Glutes','Calves','Core'],eq:['stairs'],type:'conditioning',time:3,steps:['Use the railing whenever helpful.','Take controlled steps at a sustainable pace.','Keep effort steady rather than racing.'],tips:['Your apartment flight counts.']},
{id:'march',name:'Standing March',p:'Core',s:['Quadriceps','Calves'],eq:['bodyweight'],type:'conditioning',time:3,steps:['Stand tall near a support if helpful.','March at an easy steady pace.','Keep breathing comfortable.'],tips:['Use this when walking or stairs are not a good fit.']},
{id:'mobility',name:'Standing Mobility Flow',p:'Core',s:['Shoulders','Glutes'],eq:['bodyweight'],type:'recovery',time:5,steps:['Move slowly through gentle shoulder, hip, and ankle ranges.','Keep every movement controlled.','Stay upright throughout.'],tips:['No head-below-heart positions.']}
];
const DEFAULT={version:3,profile:{goal:'Strength + Stamina',secondary:'Lose fat + health',duration:30,minStrength:3,maxStrength:5,rotationDays:28,protectTomorrow:true,location:'home',homeDB:[2,3],gymFullRack:true,gymBench:true,bands:true,bandAnchor:true,supports:['chair','mat','wall','counter','stairs','hill'],avoidHeadBelowHeart:true,avoidHeadFlat:true},readiness:{energy:'okay',soreness:'some',minutes:30,location:'home'},workouts:[],movements:[],prefs:{},strength:{},muscleLoad:{},lastWorkoutId:null,coach:true};
let S=load(); let tab='today'; let activeWorkout=null; let coachIndex=0;
function load(){try{let x=JSON.parse(localStorage.getItem('forgefit'));return merge(DEFAULT,x)}catch(e){return structuredClone(DEFAULT)}}
function merge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a;if(a&&typeof a==='object'){const o={};for(const k in a)o[k]=merge(a[k],b?.[k]);for(const k in b||{})if(!(k in o))o[k]=b[k];return o}return b===undefined?a:b}
function save(){localStorage.setItem('forgefit',JSON.stringify(S))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function daysAgo(d){return (Date.now()-new Date(d).getTime())/864e5}
function muscleRecovery(m){const entries=S.workouts.filter(w=>w.completed).flatMap(w=>w.exercises.filter(e=>e.p===m||e.s.includes(m)).map(e=>({d:w.date,sets:e.sets.filter(s=>s.done).length,fb:e.feedback}))).sort((a,b)=>new Date(b.d)-new Date(a.d));if(!entries.length)return 100;const x=entries[0];const half= m==='Quadriceps'||m==='Glutes'||m==='Hamstrings'?50:38;let fatigue=Math.min(70,18+x.sets*9+(x.fb==='tooHard'?14:x.fb==='hard'?7:0));return Math.round(Math.min(100,Math.max(18,100-fatigue*Math.exp(-daysAgo(x.d)*24/half))))}
function readinessScore(){let v=70;if(S.readiness.energy==='low')v-=20;if(S.readiness.energy==='great')v+=15;if(S.readiness.soreness==='none')v+=10;if(S.readiness.soreness==='aLot')v-=25;return Math.max(0,Math.min(100,v))}
function weekStrengthCount(){const cutoff=Date.now()-7*864e5;return new Set(S.workouts.filter(w=>w.completed&&w.kind==='strength'&&new Date(w.date).getTime()>cutoff).map(w=>new Date(w.date).toDateString())).size}
function locationEq(){const l=S.readiness.location;if(l==='gym')return ['bodyweight','dumbbells','bench','bands','anchor','stairs'];if(l==='outdoors')return ['bodyweight','outdoors','hill','stairs'];return ['bodyweight','dumbbells','bands','anchor','counter','stairs'];}
function compatible(ex){const e=locationEq();return ex.eq.every(q=>e.includes(q)||q==='dumbbells'&&e.includes('dumbbells'))}
function preferenceScore(ex){const p=S.prefs[ex.id]||'neutral';return p==='more'?18:p==='less'?-15:p==='never'?-999:0}
function recentPenalty(ex){const recent=S.workouts.filter(w=>w.completed&&daysAgo(w.date)<S.profile.rotationDays).flatMap(w=>w.exercises.map(e=>e.id));const n=recent.filter(id=>id===ex.id).length;return Math.min(10,n*1.5)}
function chooseKind(){if(S.readiness.location==='outdoors')return readinessScore()<55?'recovery':'conditioning';if(S.readiness.soreness==='aLot'||readinessScore()<48)return 'recovery';const n=weekStrengthCount();if(n<S.profile.minStrength)return 'strength';if(n>=S.profile.maxStrength)return readinessScore()>72?'conditioning':'recovery';return readinessScore()>=62?'strength':'conditioning'}
function targetWeight(ex){if(!ex.eq.includes('dumbbells'))return 0;const hist=S.strength[ex.id];let raw=hist?.nextWeight||0;if(!raw){raw=S.readiness.location==='gym'?5:(S.profile.homeDB.includes(3)?3:2)}if(S.readiness.location==='home'){const vals=S.profile.homeDB.slice().sort((a,b)=>a-b);return vals.reduce((best,v)=>Math.abs(v-raw)<Math.abs(best-raw)?v:best,vals[0]||0)}return Math.max(5,Math.round(raw/5)*5)}
function generate(){const kind=chooseKind();const minutes=+S.readiness.minutes||30;let items=[];if(kind==='strength'){
 const muscles=MUSCLES.map(m=>({m,r:muscleRecovery(m)})).sort((a,b)=>b.r-a.r);let lowerUsed=0;const desired=Math.max(4,Math.min(7,Math.round(minutes/5)));
 for(const mm of muscles){if(items.length>=desired)break;const lower=['Quadriceps','Hamstrings','Glutes','Calves'].includes(mm.m);if(lower&&S.profile.protectTomorrow&&lowerUsed>=2)continue;let cand=EX.filter(x=>x.type==='strength'&&x.p===mm.m&&compatible(x)&&(S.prefs[x.id]||'neutral')!=='never').map(x=>({x,score:mm.r+preferenceScore(x)-recentPenalty(x)+(x.compound?4:0)+Math.random()*2})).sort((a,b)=>b.score-a.score)[0]?.x;if(cand){items.push(makeWorkoutEx(cand));if(lower)lowerUsed++;}}
 if(items.length<4){EX.filter(x=>x.type==='strength'&&compatible(x)&&!items.some(y=>y.id===x.id)&&(S.prefs[x.id]||'neutral')!=='never').slice(0,4-items.length).forEach(x=>items.push(makeWorkoutEx(x)))}
 }else{let pool=EX.filter(x=>x.type===kind&&compatible(x));if(!pool.length)pool=EX.filter(x=>x.type===kind&&['brisk_walk','march','mobility'].includes(x.id));let block=Math.max(2,Math.min(6,Math.round(minutes/8)));items=pool.sort(()=>Math.random()-.5).slice(0,block).map(makeWorkoutEx)}
 activeWorkout={id:crypto.randomUUID(),date:new Date().toISOString(),kind,title:kind==='strength'?'Adaptive Strength':kind==='conditioning'?'Stamina Builder':'Recovery Movement',minutes,completed:false,exercises:items,rationale:reasonText(kind)};coachIndex=0;render()}
function reasonText(kind){const r=[];if(kind==='strength')r.push(`${weekStrengthCount()} strength days completed in the last 7 days; target is ${S.profile.minStrength}–${S.profile.maxStrength}.`);r.push(`Today's readiness is ${readinessScore()}/100.`);if(S.profile.protectTomorrow)r.push('Lower-body volume is capped to protect tomorrow.');r.push(`Equipment is filtered for ${locName(S.readiness.location)}.`);return r}
function makeWorkoutEx(ex){if(ex.type!=='strength')return {...ex,sets:[{minutes:ex.time||4,done:false}],feedback:null};const reps=ex.compound?8:10;const setCount=S.readiness.soreness==='aLot'?1:(S.profile.protectTomorrow&&['Quadriceps','Glutes','Hamstrings'].includes(ex.p)?2:3);const wt=targetWeight(ex);return {...ex,sets:Array.from({length:setCount},()=>({reps,weight:wt,done:false})),feedback:null}}
function locName(l){return l==='gym'?'Apartment Gym':l==='outdoors'?'Outdoors':'Home'}
function completeWorkout(){if(!activeWorkout)return;activeWorkout.completed=true;activeWorkout.exercises.forEach(e=>{if(e.type==='strength'){const done=e.sets.filter(s=>s.done);if(done.length){const last=done[done.length-1];const fb=e.feedback;let next=last.weight;if(fb==='easy')next*=1.08;else if(fb==='right')next*=1.03;else if(fb==='hard')next*=1;else if(fb==='tooHard')next*=.9;S.strength[e.id]={lastWeight:last.weight,nextWeight:Math.max(0,Math.round(next*2)/2),date:new Date().toISOString(),bestReps:Math.max(...done.map(s=>s.reps))}}}});S.workouts.unshift(activeWorkout);S.lastWorkoutId=activeWorkout.id;save();activeWorkout=null;toast('Workout saved. ForgeFit learned from it.');tab='today';render()}
function alternatives(id){const cur=(activeWorkout?.exercises||[]).find(e=>e.id===id);if(!cur)return[];let a=EX.filter(x=>x.id!==id&&compatible(x)&&(S.prefs[x.id]||'neutral')!=='never');if(cur.type==='strength')a=a.filter(x=>x.type==='strength'&&(x.p===cur.p||x.s.includes(cur.p)));else a=a.filter(x=>x.type!=='strength');return a.slice(0,5)}
function swap(oldId,newId){const i=activeWorkout.exercises.findIndex(e=>e.id===oldId);const ex=EX.find(x=>x.id===newId);if(i>=0&&ex){activeWorkout.exercises[i]=makeWorkoutEx(ex);closeModal();toast('Exercise swapped');render()}}
function showAlternatives(id){const cur=activeWorkout.exercises.find(e=>e.id===id);const a=alternatives(id);showModal(`<h2>Alternative</h2><p class="muted">Replace <b>${cur.name}</b> with:</p>${a.map(x=>`<div class="option" onclick="swap('${id}','${x.id}')"><b>${x.name}</b><div class="small muted">${x.p} · ${x.eq.join(', ')}</div></div>`).join('')||'<div class="empty">No good alternative found for this location.</div>'}`)}
function showModal(html){document.getElementById('sheet').innerHTML=html+`<button class="secondary" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function updateSet(ei,si,key,val){activeWorkout.exercises[ei].sets[si][key]=key==='done'?val:(+val||0)}
function setFeedback(ei,val){activeWorkout.exercises[ei].feedback=val;renderWorkoutOnly()}
function renderWorkoutOnly(){render()}
function today(){const last=S.workouts[0];return `<div class="container"><section class="card hero"><div class="eyebrow">Your adaptive coach</div><h1>Strong, capable, and ready for tomorrow.</h1><p class="muted">30 minutes by default. Science underneath; simple on the surface.</p><div class="chipline"><span class="chip">Strength + stamina</span><span class="chip">3–5 strength days</span><span class="chip">Daily movement</span></div></section>
${activeWorkout?workoutView():`<section class="card"><div class="row"><div><div class="eyebrow">Daily readiness</div><h2 style="margin-bottom:4px">How are you today?</h2></div><div class="big-num">${readinessScore()}</div></div><div class="bar"><span style="width:${readinessScore()}%"></span></div><div class="hr"></div>${readinessControls()}<button class="primary" onclick="generate()">Build today's workout</button><details class="details"><summary>How ForgeFit decides</summary><p class="small muted" style="margin-top:9px">It combines your strength-day target, muscle recovery, recent performance, simple effort feedback, exercise preferences, available equipment, location, and today's energy/soreness. Your own check-in outranks phone data.</p></details></section>`}
<section class="card"><div class="row"><div><div class="eyebrow">Purposeful movement</div><h3>Phone wasn't with you?</h3></div><button class="secondary" onclick="movementModal()">Log movement</button></div><p class="small muted">Walking, stairs, hills, mobility, or another purposeful session still counts even when your phone didn't record it.</p></section>${last?`<section class="card"><div class="eyebrow">Most recent</div><h3>${last.title}</h3><p class="muted small">${new Date(last.date).toLocaleDateString()} · ${last.exercises.length} activities</p></section>`:''}<section class="card install"><b>Add ForgeFit to your iPhone:</b> in Safari tap <b>Share</b> → <b>Add to Home Screen</b>. It will open full-screen like an app.</section></div>`}
function readinessControls(){return `<div class="field"><label>Energy</label><div class="seg">${['low','okay','great'].map(x=>`<button class="${S.readiness.energy===x?'active':''}" onclick="S.readiness.energy='${x}';save();render()">${x==='okay'?'Okay':cap(x)}</button>`).join('')}</div></div><div class="field"><label>Soreness</label><div class="seg">${[['none','None'],['some','Some'],['aLot','A lot']].map(x=>`<button class="${S.readiness.soreness===x[0]?'active':''}" onclick="S.readiness.soreness='${x[0]}';save();render()">${x[1]}</button>`).join('')}</div></div><div class="grid2"><div class="field"><label>Time</label><select onchange="S.readiness.minutes=+this.value;save()">${[10,20,30,40,45].map(x=>`<option ${S.readiness.minutes==x?'selected':''} value="${x}">${x} min</option>`).join('')}</select></div><div class="field"><label>Where</label><select onchange="S.readiness.location=this.value;save();render()"><option value="home" ${S.readiness.location==='home'?'selected':''}>Home</option><option value="gym" ${S.readiness.location==='gym'?'selected':''}>Apartment Gym</option><option value="outdoors" ${S.readiness.location==='outdoors'?'selected':''}>Outdoors</option></select></div></div>`}
function workoutView(){const w=activeWorkout;return `<section class="card"><div class="row"><div><div class="eyebrow">${w.kind}</div><h2>${w.title}</h2><div class="muted small">${w.minutes} min · ${locName(S.readiness.location)}</div></div><button class="ghost" onclick="S.coach=!S.coach;save();render()">${S.coach?'Full Plan':'Coach View'}</button></div><details class="details"><summary>Why this workout?</summary><ul class="list small muted">${w.rationale.map(x=>`<li>${x}</li>`).join('')}</ul></details></section>${S.coach?coachView(w):fullView(w)}<div class="container" style="padding-top:0"><button class="primary" onclick="completeWorkout()">Finish & save workout</button><button class="secondary" style="width:100%;margin-top:8px" onclick="activeWorkout=null;render()">Cancel workout</button></div>`}
function coachView(w){const e=w.exercises[Math.min(coachIndex,w.exercises.length-1)];const i=w.exercises.indexOf(e);return `<div class="container" style="padding-top:0"><section class="card coach"><div class="row"><span class="badge">${i+1} of ${w.exercises.length}</span><button class="secondary" onclick="showAlternatives('${e.id}')">Alternative</button></div><div class="eyebrow" style="margin-top:16px">${e.p}</div><h2 style="font-size:27px">${e.name}</h2>${setsHTML(e,i)}<details class="details"><summary>How to do it</summary><ol class="list small">${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol>${e.tips?.length?`<div class="notice">${e.tips.join(' ')}</div>`:''}</details>${e.type==='strength'?feedbackHTML(e,i):''}<div class="coach-nav"><button class="secondary" ${i===0?'disabled':''} onclick="coachIndex=Math.max(0,coachIndex-1);render()">Back</button><button class="secondary" ${i===w.exercises.length-1?'disabled':''} onclick="coachIndex=Math.min(${w.exercises.length-1},coachIndex+1);render()">Next</button></div></section></div>`}
function fullView(w){return `<div class="container" style="padding-top:0">${w.exercises.map((e,i)=>`<section class="workout-card"><div class="row"><div><div class="exercise-title">${e.name}</div><span class="badge">${e.p}</span></div><button class="secondary" onclick="showAlternatives('${e.id}')">Alternative</button></div>${setsHTML(e,i)}<details class="details"><summary>Technique</summary><ol class="list small">${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol></details>${e.type==='strength'?feedbackHTML(e,i):''}</section>`).join('')}</div>`}
function setsHTML(e,ei){if(e.type!=='strength')return `<div class="sets"><label class="check"><input type="checkbox" ${e.sets[0].done?'checked':''} onchange="updateSet(${ei},0,'done',this.checked)"><span><b>${e.sets[0].minutes} minutes</b> · mark complete</span></label></div>`;return `<div class="sets">${e.sets.map((s,si)=>`<div class="setrow"><b>${si+1}</b><input aria-label="weight" type="number" inputmode="decimal" value="${s.weight}" onchange="updateSet(${ei},${si},'weight',this.value)"><input aria-label="reps" type="number" inputmode="numeric" value="${s.reps}" onchange="updateSet(${ei},${si},'reps',this.value)"><input type="checkbox" ${s.done?'checked':''} onchange="updateSet(${ei},${si},'done',this.checked)"></div>`).join('')}<div class="small muted">Weight · reps · ✓</div></div>`}
function feedbackHTML(e,ei){return `<div class="details"><b>How was that?</b><div class="feedback">${[['easy','Too easy'],['right','Just right'],['hard','Hard but doable'],['tooHard','Too hard']].map(x=>`<button class="${e.feedback===x[0]?'selected':''}" onclick="setFeedback(${ei},'${x[0]}')">${x[1]}</button>`).join('')}</div></div>`}
function history(){return `<div class="container"><section class="card"><div class="eyebrow">History</div><h1>Your work counts.</h1><p class="muted">Completed workouts and manually logged purposeful movement.</p></section>${S.workouts.length?S.workouts.map(w=>`<section class="card"><div class="row"><div><h3>${w.title}</h3><div class="small muted">${new Date(w.date).toLocaleString()} · ${w.kind}</div></div><span class="pill">${w.exercises.length} items</span></div><div class="small">${w.exercises.map(e=>e.name).join(' · ')}</div></section>`).join(''):'<div class="empty">No workouts saved yet.</div>'}${S.movements.map(m=>`<section class="card"><h3>${m.type}</h3><div class="small muted">${new Date(m.date).toLocaleString()} · ${m.minutes} min</div>${m.note?`<p class="small">${m.note}</p>`:''}</section>`).join('')}</div>`}
function progress(){const total=S.workouts.length;const week=weekStrengthCount();const mastered=Object.keys(S.strength).length;const rec=MUSCLES.map(m=>({m,r:muscleRecovery(m)}));return `<div class="container"><section class="card"><div class="eyebrow">Progress</div><h1>Capability over punishment.</h1><p class="muted">ForgeFit emphasizes consistency, strength progress, stamina, and how you feel—not just scale weight.</p><div class="grid3"><div class="stat"><strong>${total}</strong><span class="small muted">Workouts</span></div><div class="stat"><strong>${week}</strong><span class="small muted">Strength / 7d</span></div><div class="stat"><strong>${mastered}</strong><span class="small muted">Tracked lifts</span></div></div></section><section class="card"><h3>Muscle recovery</h3>${rec.map(x=>`<div class="progress-row"><div class="row small"><b>${x.m}</b><span>${x.r}%</span></div><div class="bar"><span style="width:${x.r}%"></span></div></div>`).join('')}</section><section class="card"><h3>Strength estimates</h3>${Object.keys(S.strength).length?Object.entries(S.strength).map(([id,v])=>{const ex=EX.find(x=>x.id===id);return `<div class="row" style="padding:8px 0"><span>${ex?.name||id}</span><b>${v.nextWeight} lb next</b></div>`}).join(''):'<p class="muted small">Finish some strength workouts and ForgeFit will begin adapting recommended loads.</p>'}</section></div>`}
function settings(){return `<div class="container"><section class="card"><div class="eyebrow">Your plan</div><h1>Personalized for you</h1><div class="field"><label>Default workout length</label><select onchange="S.profile.duration=+this.value;S.readiness.minutes=+this.value;save()">${[20,30,35,40,45].map(x=>`<option ${S.profile.duration==x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Minimum strength days</label><input type="number" min="1" max="6" value="${S.profile.minStrength}" onchange="S.profile.minStrength=+this.value;save()"></div><div class="field"><label>Maximum strength days</label><input type="number" min="1" max="7" value="${S.profile.maxStrength}" onchange="S.profile.maxStrength=+this.value;save()"></div></div><label class="check"><input type="checkbox" ${S.profile.protectTomorrow?'checked':''} onchange="S.profile.protectTomorrow=this.checked;save()"><span><b>Protect tomorrow</b><br><span class="small muted">Cap lower-body dose so strength work doesn't routinely make the next morning miserable.</span></span></label></section><section class="card"><h3>Equipment profiles</h3><p class="small"><b>Home:</b> 2 lb + 3 lb dumbbells, therapy bands (all intensities), chair, mat, wall, countertop, stairs, nearby hill.</p><p class="small"><b>Apartment gym:</b> full dumbbell rack + adjustable bench.</p><p class="small"><b>Bands:</b> can be tied into loops and securely anchored.</p></section><section class="card"><h3>Position rules</h3><div class="notice"><b>Never generate:</b> head below heart or head flat on the floor. Flat bench work is excluded. Inclined/upright supported work is allowed.</div></section><section class="card"><h3>Exercise preferences</h3><p class="muted small">Tap any exercise to tell ForgeFit to show it more, less, or never. Lunges are not restricted.</p>${EX.filter(x=>x.type==='strength').map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #f2f4f7"><span>${x.name}</span><select style="width:120px;padding:7px;border:1px solid var(--line);border-radius:9px" onchange="S.prefs['${x.id}']=this.value;save()"><option value="neutral" ${(S.prefs[x.id]||'neutral')==='neutral'?'selected':''}>Neutral</option><option value="more" ${S.prefs[x.id]==='more'?'selected':''}>More</option><option value="less" ${S.prefs[x.id]==='less'?'selected':''}>Less</option><option value="never" ${S.prefs[x.id]==='never'?'selected':''}>Never</option></select></div>`).join('')}</section><section class="card"><h3>Data</h3><button class="secondary" onclick="exportData()">Export backup</button> <button class="secondary danger" onclick="if(confirm('Reset all ForgeFit data?')){localStorage.removeItem('forgefit');location.reload()}">Reset</button><p class="small muted" style="margin-top:10px">Your workout history is stored in Safari on this iPhone. This version does not have HealthKit access.</p></section></div>`}
function movementModal(){showModal(`<h2>Log movement</h2><div class="field"><label>Type</label><select id="mvtype"><option>Walk</option><option>Hill walk</option><option>Stairs</option><option>Mobility</option><option>Other purposeful movement</option></select></div><div class="field"><label>Minutes</label><input id="mvmin" type="number" value="20"></div><div class="field"><label>Optional note</label><input id="mvnote" placeholder="How it felt, route, etc."></div><button class="primary" onclick="logMovement()">Save movement</button>`)}
function logMovement(){S.movements.unshift({id:crypto.randomUUID(),date:new Date().toISOString(),type:document.getElementById('mvtype').value,minutes:+document.getElementById('mvmin').value||0,note:document.getElementById('mvnote').value});save();closeModal();toast('Movement saved')}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ForgeFit-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function render(){document.getElementById('headerMode').textContent=activeWorkout?(activeWorkout.kind==='strength'?'Strength':activeWorkout.kind==='conditioning'?'Stamina':'Recovery'):'Adaptive';document.getElementById('app').innerHTML=tab==='today'?today():tab==='history'?history():tab==='progress'?progress():settings();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script>
</body>
</html>
